<div class="form-group">
    <label for="password">Password</label>

    <div class="password-wrapper">
        <input
            type="password"
            id="password"
            placeholder="Enter your password"
        >

        <button
            type="button"
            id="togglePassword"
            class="toggle-password"
        >
            Show
        </button>
    </div>

    <small class="error-message" id="passwordError"></small>
</div>
